name: release
# Manual only (Actions → release → Run workflow). mode=dry-run runs the full
# gate, packs, and `npm publish --dry-run`s the packed tarballs; mode=publish
# runs the same gate, then the publish job, which waits for approval in the
# `npm` environment. npm authenticates through GitHub OIDC (trusted publishing)
# and signs provenance — no npm token is stored here. See RELEASING.md.
#
# Privileges are split (audit 2026-10-25 round 3, M28): install, build and pack
# run in jobs with a read-only token; the publish job holds the OIDC token and
# runs no install and no build — only `npm publish <tarball> --ignore-scripts`
# over the pack job's artifact; tags are pushed by a job of their own, the only
# one with contents: write. No checkout keeps its credentials.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run checks and packs; publish uploads to npm
        type: choice
        options: [dry-run, publish]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }   # exact pin; bump with each Node security release
      - run: node scripts/check-node.mjs   # stop here on a Node that misses a security release
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm registry:check
      - run: pnpm test:examples
      - run: pnpm pack:check
      - run: npm install -g npm@11.11.0 # trusted publishing needs npm >= 11.5.1
      - run: pnpm release:dry

  hermes:
    # The Hermes VM React Native ships exists only as react-native/sdks/hermesc/osx-bin/hermes.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }   # exact pin; bump with each Node security release
      - run: node scripts/check-node.mjs   # stop here on a Node that misses a security release
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:hermes

  pack:
    # Unprivileged: the only job of the release that installs, builds and packs.
    needs: [verify, hermes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }   # exact pin; bump with each Node security release
      - run: node scripts/check-node.mjs   # stop here on a Node that misses a security release
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack:check
      - run: node scripts/publish.mjs --pack-only --out release-tarballs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: release-tarballs, path: release-tarballs/, if-no-files-found: error, retention-days: 1 }

  publish-dry:
    # dry-run mode: the publish job's exact path over the packed tarballs, without the OIDC token.
    if: inputs.mode == 'dry-run'
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: node scripts/check-node.mjs
      - run: npm install -g npm@11.11.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-tarballs, path: release-tarballs/ }
      - run: node scripts/publish.mjs --from release-tarballs --dry-run

  publish:
    if: inputs.mode == 'publish'
    needs: pack
    runs-on: ubuntu-latest
    environment: npm # required reviewer: the owner approves every publish
    permissions:
      contents: read  # the checkout (scripts/publish.mjs, .nvmrc); nothing is pushed from here
      id-token: write # npm trusted publishing + provenance
    outputs:
      tags: ${{ steps.npm.outputs.tags }}
    steps:
      # No install, no build: the code that runs next to the OIDC token is this repo's
      # scripts/publish.mjs and npm itself, publishing the pack job's tarballs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc }
      - run: node scripts/check-node.mjs   # stop here on a Node that misses a security release
      - run: npm install -g npm@11.11.0 # trusted publishing needs npm >= 11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release-tarballs, path: release-tarballs/ }
      - id: npm
        env:
          # The publish credential until trusted publishing is on (RELEASING.md:
          # a 30-day granular token, rotated); with the secret unset npm uses OIDC.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc; fi
          node scripts/publish.mjs --from release-tarballs

  tag:
    # Also after a partial failure: the versions that did reach npm get their tags.
    needs: publish
    if: ${{ !cancelled() && needs.publish.outputs.tags != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tags; this job runs git only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Tag what was published
        env:
          TAGS: ${{ needs.publish.outputs.tags }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for t in $TAGS; do git tag "$t"; done
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" $TAGS
