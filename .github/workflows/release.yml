name: release
# Manual only (Actions → release → Run workflow). mode=dry-run runs the full
# gate and packs + `npm publish --dry-run`s every package; mode=publish runs the
# same gate, then the publish job, which waits for approval in the `npm`
# environment. npm authenticates through GitHub OIDC (trusted publishing) and
# signs provenance — no npm token is stored here. See RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run checks and packs; publish uploads to npm
        type: choice
        options: [dry-run, publish]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, check-latest: true, cache: pnpm }
      - run: node scripts/check-node.mjs   # stop here on a Node that misses a security release
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm registry:check
      - run: pnpm test:examples
      - run: pnpm pack:check
      - run: npm install -g npm@11.11.0 # trusted publishing needs npm >= 11.5.1
      - run: pnpm release:dry

  hermes:
    # The Hermes VM React Native ships exists only as react-native/sdks/hermesc/osx-bin/hermes.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, check-latest: true, cache: pnpm }
      - run: node scripts/check-node.mjs   # stop here on a Node that misses a security release
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:hermes

  publish:
    if: inputs.mode == 'publish'
    needs: [verify, hermes]
    runs-on: ubuntu-latest
    environment: npm # required reviewer: the owner approves every publish
    permissions:
      contents: write # push the release tags
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, check-latest: true, cache: pnpm }
      - run: node scripts/check-node.mjs   # stop here on a Node that misses a security release
      - run: npm install -g npm@11.11.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack:check
      - id: npm
        env:
          # Only for a first release before the packages have trusted publishers
          # (RELEASING.md); leave the secret unset afterwards and npm uses OIDC.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc; fi
          pnpm release
      - name: Tag what was published
        # Also after a partial failure: the versions that did reach npm get their tags.
        if: ${{ !cancelled() && steps.npm.outputs.tags != '' }}
        env:
          TAGS: ${{ steps.npm.outputs.tags }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for t in $TAGS; do git tag "$t"; done
          git push origin $TAGS
