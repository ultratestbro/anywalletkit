name: routes-canary
# Every 6 hours: one dry quote per corridor in watch/routes.json straight from the
# provider packages; Telegram only when a corridor stops quoting or comes back
# (incl. corridors the app has paused — so the pause can be lifted). State committed.
on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:
# Read-only by default: the canary job runs third-party code; only `commit` can push.
permissions:
  contents: read
concurrency: module-watch
jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: pnpm }   # exact pin; bump with each Node security release
      - run: node scripts/check-node.mjs   # stop here on a Node that misses a security release
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' build
      - name: routes canary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WATCH_CHAT: ${{ secrets.TELEGRAM_WATCH_CHAT }}
          TELEGRAM_WATCH_TOPIC: ${{ secrets.TELEGRAM_WATCH_TOPIC }}
          EVM_RPC_URL: ${{ secrets.EVM_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          LIFI_API_KEY: ${{ secrets.LIFI_API_KEY }}
          NEAR_INTENTS_JWT: ${{ secrets.NEAR_INTENTS_JWT }}
        run: node scripts/watch/routes.mjs --send --timeout 30
      - name: keep the state for the commit job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: routes-state, path: watch/routes/, if-no-files-found: error, include-hidden-files: true, retention-days: 1 }

  commit:
    # Writes the canary state back; runs no install, no build, no module code.
    needs: routes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rm -rf watch/routes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: routes-state, path: watch/routes/ }
      - name: commit state
        run: |
          git config user.name "module-watch"
          git config user.email "module-watch@users.noreply.github.com"
          git add -A watch/routes
          git diff --cached --quiet && exit 0
          git commit -m "routes: $(date -u +%FT%H:%M)"
          # A dispatched / scheduled run checks out the SHA from trigger time; another watch run may have pushed since (both share the concurrency group, but checkout predates the wait). Rebase, then push; retry a few times.
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep $((i * 5)); done
          echo "could not push the snapshot after 5 attempts" >&2; exit 1
