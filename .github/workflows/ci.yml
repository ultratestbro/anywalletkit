name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [22, 24] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ matrix.node }}", check-latest: true, cache: pnpm }
      - run: node scripts/check-node.mjs   # stop here on a Node that misses a security release
      - run: pnpm install --frozen-lockfile
      - run: pnpm build          # workspace types resolve through each package's dist
      - run: pnpm typecheck
      - run: pnpm lint && pnpm lint:rules   # promises nobody awaits, Number() on bigints
        if: matrix.node == 22
      - run: pnpm test
      - run: pnpm registry:check # registry/modules.json must match the manifests
      - run: pnpm test:examples  # the docs Quickstart is this code: it must compile and pass
      - run: pnpm pack:check     # every package packs as it will publish (entry points, LICENSE, no workspace ranges)
        if: matrix.node == 22


  docs:
    # docs.anywallet.tech: snippets are #region blocks of /examples — a renamed or missing region fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, check-latest: true, cache: pnpm }
      - run: node scripts/check-node.mjs   # stop here on a Node that misses a security release
      - run: pnpm install --frozen-lockfile
      - run: pnpm build          # the API reference (TypeDoc) resolves cross-package types through each package's dist
      - run: pnpm docs:build

  hermes:
    # Derive + sign on every chain inside the Hermes VM React Native ships, bundle lowered
    # with the RN Babel preset. macOS: react-native ships that VM only as
    # sdks/hermesc/osx-bin/hermes (linux64-bin has just the compiler), and on Linux the smoke
    # fell back to hermes-engine-cli 0.12 from 2022 — not the engine apps run.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, check-latest: true, cache: pnpm }
      - run: node scripts/check-node.mjs   # stop here on a Node that misses a security release
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:hermes
