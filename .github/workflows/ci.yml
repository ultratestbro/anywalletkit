name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [20, 22, 24] }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build          # workspace types resolve through each package's dist
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm registry:check # registry/modules.json must match the manifests
      - run: pnpm test:examples  # the docs Quickstart is this code: it must compile and pass
      - run: pnpm pack:check     # every package packs as it will publish (entry points, LICENSE, no workspace ranges)
        if: matrix.node == 22


  docs:
    # docs.anywallet.tech: snippets are #region blocks of /examples — a renamed or missing region fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build          # the API reference (TypeDoc) resolves cross-package types through each package's dist
      - run: pnpm docs:build

  hermes:
    # Derive + sign on every chain inside the Hermes VM React Native ships
    # (react-native/sdks/hermesc/linux64-bin/hermes), bundle lowered with the RN Babel preset.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:hermes
