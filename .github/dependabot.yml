# Dependency update PRs. Minor and patch bumps come grouped in one PR per ecosystem a week; majors
# come one by one, except the Solana libraries, which move together. Actions stay pinned to commit
# SHAs (Dependabot bumps the SHA and its version comment). Every version update waits until the
# release is a week old (cooldown); security updates (repo setting) are not delayed.
version: 2
updates:
  - package-ecosystem: npm          # the pnpm workspace (pnpm-lock.yaml at the root)
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # a release is a week old before a PR proposes it
    open-pull-requests-limit: 3
    ignore:
      # @types/node follows the Node majors CI runs (.nvmrc, the ci matrix), not the newest Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      solana:                       # @solana/* and @solana-program/* must stay on one release line
        patterns: ["@solana/*", "@solana-program/*"]
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }   # same week as npm: a fresh action release is where a hijack shows
    open-pull-requests-limit: 2
    groups:
      actions:
        update-types: [minor, patch]
